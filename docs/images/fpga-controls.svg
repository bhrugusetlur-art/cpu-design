<g data-role="switch"><rect x="302" y="565" width="30" height="56" rx="4" class="switch"/><rect x="308" y="591" width="18" height="22" rx="3" class="paddle"/><text x="317" y="635" class="tiny">14</text></g>
<g data-role="switch"><rect x="359" y="565" width="30" height="56" rx="4" class="switch"/><rect x="365" y="591" width="18" height="22" rx="3" class="paddle"/><text x="374" y="635" class="tiny">13</text></g>
<g data-role="switch"><rect x="416" y="565" width="30" height="56" rx="4" class="switch"/><rect x="422" y="591" width="18" height="22" rx="3" class="paddle"/><text x="431" y="635" class="tiny">12</text></g>
<g data-role="switch"><rect x="473" y="565" width="30" height="56" rx="4" class="switch"/><rect x="479" y="591" width="18" height="22" rx="3" class="paddle"/><text x="488" y="635" class="tiny">11</text></g>
<g data-role="switch"><rect x="530" y="565" width="30" height="56" rx="4" class="switch"/><rect x="536" y="591" width="18" height="22" rx="3" class="paddle"/><text x="545" y="635" class="tiny">10</text></g>
<g data-role="switch"><rect x="587" y="565" width="30" height="56" rx="4" class="switch"/><rect x="593" y="591" width="18" height="22" rx="3" class="paddle"/><text x="602" y="635" class="tiny">9</text></g>
